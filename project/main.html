<html lang="en">

    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SantapanGO</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: #0d6efd;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .card {
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .menu-img {
            height: 150px;
            object-fit: cover;
        }

        .btn-order {
            background-color: #ff6b6b;
            color: white;
        }

        .btn-order:hover {
            background-color: #e55a5a;
        }

        .cart {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 300px;
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .cart h5 {
            margin-bottom: 15px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">SantapanGO</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" href="#" onclick="showHome()">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" onclick="showOrder()">Order</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- HOME PAGE -->
<div id="homePage" class="container mt-4">
    <h2>Selamat Datang di SantapanGO</h2>
    <p>Pesan makanan favoritmu dengan cepat dan mudah!</p>
</div>

<!-- ORDER PAGE -->
<div id="orderPage" class="container mt-4" style="display: none;">
    <h3 class="mb-4">Menu Kantin</h3>

    <div class="row">

        <!-- Item 1 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="img/nasigoreng.png" class="card-img-top menu-img" alt="Nasi Goreng">
                <div class="card-body">
                    <h5 class="card-title">Nasi Goreng</h5>
                    <p class="card-text">Rp 15.000</p>
                    <button class="btn btn-order w-100" onclick="addToCart('Nasi Goreng',15000)">
                        Pesan
                    </button>
                </div>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="project/img/mieayam.jpg" class="card-img-top menu-img" alt="Mie Ayam">
                <div class="card-body">
                    <h5 class="card-title">Mie Ayam</h5>
                    <p class="card-text">Rp 12.000</p>
                    <button class="btn btn-order w-100" onclick="addToCart('Mie Ayam',12000)">
                        Pesan
                    </button>
                </div>
            </div>
        </div>

        <!-- Item 3 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="project/img/esteh.jpg" class="card-img-top menu-img" alt="Es Teh">
                <div class="card-body">
                    <h5 class="card-title">Es Teh</h5>
                    <p class="card-text">Rp 5.000</p>
                    <button class="btn btn-order w-100" onclick="addToCart('Es Teh',5000)">
                        Pesan
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Cart -->
<div class="cart">
    <h5>🛒 Keranjang</h5>

    <ul id="cart-list" class="list-group mb-3"></ul>

    <strong>Total: Rp <span id="total">0</span></strong>

    <button id="clearBtn" class="btn btn-danger" onclick="clearCart()" style="display: none;">
    Hapus Keranjang
    </button>

        <button class="btn btn-success" onclick="checkout()">
            Bayar
        </button>
    </div>
</div>

<script>
    let total = 0;

    window.onload = function () {
    const lastPage = sessionStorage.getItem("lastPage");

    if (lastPage === "order") {
        showOrder();
    } else {
        showHome();
    }
};

function showHome() {
    document.getElementById("homePage").style.display = "block";
    document.getElementById("orderPage").style.display = "none";

    // Simpan halaman terakhir
    sessionStorage.setItem("lastPage", "home");
}

function showOrder() {
    document.getElementById("homePage").style.display = "none";
    document.getElementById("orderPage").style.display = "block";

    // Simpan halaman terakhir
    sessionStorage.setItem("lastPage", "order");
}

    function addToCart(nama, harga) {
        const list = document.getElementById("cart-list");

        let item = document.createElement("li");
        item.className = "list-group-item";
        item.innerText = nama + " - Rp " + harga;

        list.appendChild(item);

        total += harga;
        document.getElementById("total").innerText = total;

        toggleClearButton();
    }

    function clearCart() {
        const list = document.getElementById("cart-list");
        list.innerHTML = "";

        total = 0;
        document.getElementById("total").innerText = total;

        toggleClearButton();
    }

    function checkout() {
        if (total === 0) {
            alert("Keranjang masih kosong!");
        } else {
            alert("Pembayaran berhasil! Total bayar: Rp " + total);

            clearCart();
        }
    }

    function toggleClearButton() {
        const clearBtn = document.getElementById("clearBtn");
        const cartList = document.getElementById("cart-list");

        if (cartList.children.length > 0) {
            clearBtn.style.display = "block";
        } else {
            clearBtn.style.display = "none";
        }
    }
</script>

</body>
</html>
